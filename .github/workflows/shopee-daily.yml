name: 蝦皮每日草稿

on:
  schedule:
    - cron: "0 0 * * *"   # 台灣時間每天 08:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shopee-bot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      # 預設 false = 只存草稿;到 Settings → Variables 設 AUTO_PUBLISH=true 才會自動發
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || 'https://zoosa1105-maker.github.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shopee_bot/requirements.txt
      - name: 安裝中文字型與套件
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          pip install -r shopee_bot/requirements.txt
      - name: 產生今日 3 則草稿
        run: python -m shopee_bot.generate
      - name: 草稿預覽寫進執行摘要
        run: cat drafts/*/PREVIEW.md | tail -n +1 >> "$GITHUB_STEP_SUMMARY" || true
      - name: 存回 repo(草稿、媒體、已發商品紀錄)
        run: |
          git config user.name "shopee-bot"
          git config user.email "shopee-bot@users.noreply.github.com"
          git add drafts bot-media shopee_bot/state
          git diff --cached --quiet && echo "沒有新內容" || git commit -m "bot: 今日草稿"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: 自動發布(僅 AUTO_PUBLISH=true)
        if: env.AUTO_PUBLISH == 'true'
        run: |
          python -m shopee_bot.publish
          git add drafts
          git diff --cached --quiet || git commit -m "bot: 標記已發布"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
